name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Export Xcode developer directory
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install native dependencies
        run: brew install pkg-config libmtp libusb

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go dependencies
        run: go mod download

      - name: Go format
        run: test -z "$(gofmt -l .)"

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go tests
        run: go test ./...

      - name: Go race tests
        run: go test -race ./internal/operations ./internal/converter ./internal/device ./internal/library ./internal/storage

      - name: Build core dylib
        run: make build-core

      - name: Swift tests
        run: swift test --package-path macos

      - name: Package app
        run: make package

      - name: Verify arm64 and bundled libraries
        run: |
          set -euo pipefail
          file "macos/Mint Bookshelf.app/Contents/MacOS/MintBookshelf" | grep arm64
          file "macos/Mint Bookshelf.app/Contents/Frameworks/libkindlecore.dylib" | grep arm64
          file "macos/Mint Bookshelf.app/Contents/Frameworks/libmtp.9.dylib" | grep arm64
          file "macos/Mint Bookshelf.app/Contents/Frameworks/libusb-1.0.0.dylib" | grep arm64
          ! otool -L "macos/Mint Bookshelf.app/Contents/Frameworks/libkindlecore.dylib" | grep -E '/opt/homebrew|/usr/local'
          ! otool -L "macos/Mint Bookshelf.app/Contents/Frameworks/libmtp.9.dylib" | grep -E '/opt/homebrew|/usr/local'

      - name: C header syntax
        run: printf '#include "kindle_manager.h"\nint main(void) { return 0; }\n' | clang -fsyntax-only -I bridge/include -x c -
