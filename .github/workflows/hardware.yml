name: Hardware MTP

on:
  workflow_dispatch:

jobs:
  kindle:
    runs-on: [self-hosted, macOS]
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: brew install pkg-config libmtp libusb

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Ensure Mint Bookshelf is not running
        run: pkill -f MintBookshelf || true

      - name: Hardware detect/open/list
        run: go test -tags mtp ./internal/device -run TestDetect -v

      - name: Replug reminder
        if: always()
        run: echo "If the device reset, replug it before the next run."
