<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-label="Mint Bookshelf">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1014"/>
      <stop offset="0.55" stop-color="#10181D"/>
      <stop offset="1" stop-color="#14262A"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FD8CB"/>
      <stop offset="1" stop-color="#6C7B8B"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="42" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1180" cy="70" r="190" fill="#86C9BB" opacity="0.08" filter="url(#glow)"/>
  <circle cx="240" cy="330" r="230" fill="#6C7B8B" opacity="0.10" filter="url(#glow)"/>
