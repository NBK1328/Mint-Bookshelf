    <rect x="0" y="0" width="168" height="224" rx="18" fill="#19262B" stroke="#86C9BB" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="24" y="26" width="120" height="10" rx="5" fill="#86C9BB" opacity="0.85"/>
    <rect x="24" y="52" width="86" height="8" rx="4" fill="#97A7AC" opacity="0.55"/>
    <rect x="24" y="76" width="120" height="8" rx="4" fill="#97A7AC" opacity="0.30"/>
    <rect x="24" y="98" width="104" height="8" rx="4" fill="#97A7AC" opacity="0.30"/>
    <path d="M24 178 L84 142 L144 178" fill="none" stroke="#86C9BB" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
  </g>
  <text x="320" y="152" fill="#F4F6FB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5">Mint Bookshelf</text>
  <text x="323" y="205" fill="#97A7AC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="400">Your library. Your Kindle. One native macOS app.</text>
